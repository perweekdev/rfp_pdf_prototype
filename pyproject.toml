[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rfp-pdf-prototype"
version = "0.0.1"
description = "Gradio local app: PDF 선택 → 요약 → 페이지 기반 Q&A (FAISS RAG)"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
  "gradio>=4.44.1",
  "openai>=1.0.0",
  "sentence-transformers>=2.2.2",
  "faiss-cpu>=1.7.4",
  "pdfplumber>=0.10.0",
  "numpy>=1.24",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.4", "pytest>=8"]
